<svg xmlns="http://www.w3.org/2000/svg" width="170" height="170" viewBox="0 0 170 170" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <g id="med">
      <!-- 콰트러폴 메달리온 -->
      <ellipse cx="0" cy="-15" rx="8" ry="12"/>
      <ellipse cx="0" cy="15" rx="8" ry="12"/>
      <ellipse cx="-15" cy="0" rx="12" ry="8"/>
      <ellipse cx="15" cy="0" rx="12" ry="8"/>
      <circle cx="0" cy="0" r="5"/>
      <!-- 작은 잎 장식 -->
      <circle cx="0" cy="-30" r="3"/>
      <circle cx="0" cy="30" r="3"/>
      <circle cx="-30" cy="0" r="3"/>
      <circle cx="30" cy="0" r="3"/>
    </g>
  </defs>
  <!-- 메달리온: 중앙 + 네 모서리(타일 이음) -->
  <g fill="#d99a78" fill-opacity="0.055">
    <use href="#med" x="85" y="85"/>
    <use href="#med" x="0" y="0"/>
    <use href="#med" x="170" y="0"/>
    <use href="#med" x="0" y="170"/>
    <use href="#med" x="170" y="170"/>
  </g>
  <!-- 오지(ogee) 곡선 격자 -->
  <g fill="none" stroke="#d99a78" stroke-opacity="0.05" stroke-width="2">
    <path d="M85 85 C 58 64, 46 42, 22 22"/>
    <path d="M85 85 C 112 64, 124 42, 148 22"/>
    <path d="M85 85 C 58 106, 46 128, 22 148"/>
    <path d="M85 85 C 112 106, 124 128, 148 148"/>
